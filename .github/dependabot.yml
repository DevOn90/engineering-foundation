version: 2
updates:
  # =====================================
  # GitHub Actions
  # =====================================
  - package-ecosystem: "github-actions"
    directory: "/"  
    schedule:
      interval: "weekly"      
      day: "friday"          
      time: "12:00"           
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "[deps][github-actions]: "
    groups:
      safe:
        patterns: ["*"]
        update-types: ["minor","patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  # ======================================
  # NPM (frontend)
  # ====================================== 
