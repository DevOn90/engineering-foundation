name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs: 
  # -------------------------------------------------
  # Job 1: Build API JAR
  # -------------------------------------------------
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -d apps
          test -d infra
          test -d docs

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR file
        run: |
          cd apps/api
          mvn clean package -DskipTests
          
  # ---------------------------------------------------
  # Job 2: API Contract Check
  # ---------------------------------------------------
  api-contract-check:
    name: API Contract Check
    runs-on: ubuntu-latest
    needs: build-api
    env:
      SERVICE_PORT: 8083
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run API contract check
        run: |
          bash scripts/ci/api-diff-ci.sh

  # ----------------------------------------------------
  # Job 3: Run Tests
  # ----------------------------------------------------
    
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run Tests
        run: |
          cd apps/api
          mvn test
  
  # ----------------------------------------------------
  # Job 4: Docker Build & Push
  # ----------------------------------------------------
   
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest \
            ./apps/api

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest