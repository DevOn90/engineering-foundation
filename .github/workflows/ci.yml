name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs: 
  # -------------------------------------------------
  # Job 1: Build API JAR Backend
  # -------------------------------------------------
  build-api:
    name: Build API Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Validate repository structure
        run: |
          test -d apps
          test -d infra
          test -d docs
          test -d scripts

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  #v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR file
        run: |
          cd apps/api
          mvn clean package -DskipTests

      - name: Upload API JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
         name: api-jar
         path: apps/api/target/*.jar
          
  # ---------------------------------------------------
  # Job 2: API Contract Check
  # ---------------------------------------------------
  api-contract-check:
    name: API Contract Check
    runs-on: ubuntu-latest
    needs: build-api
    env:
      SERVICE_PORT: 8083
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  #v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Download API JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 
        with:
         name: api-jar
         path: apps/api/target/

      - name: Run API contract check
        run: |
          bash scripts/ci/api-diff-ci.sh

  # ----------------------------------------------------
  # Job 3: Run Tests
  # ----------------------------------------------------
    
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  #v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Tests
        run: |
          cd apps/api
          mvn test

  # ----------------------------------------------------
  #  Job 4: Build Frontend Artifact
  # ----------------------------------------------------

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    needs: api-contract-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610  # v3
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/frontend/app
          npm ci
          
      - name: Build Angular artifact
        run: |
          cd apps/frontend/app
          npm run build -- --configuration=production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: frontend-dist
          path: apps/frontend/app/dist/app

  # ----------------------------------------------------
  # Job 5: Build & Push Backend Docker image
  # ----------------------------------------------------
   
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest \
            ./apps/api

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest

  # -------------------------------------------------------
  # Job 6: Build & Push Frontend Docker image 
  # -------------------------------------------------------  

  docker-build-frontend:
    name: Docker Build & Push Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Download Frontend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 
        with:
          name: frontend-dist
          path: apps/frontend/app/dist/app

      - name: Build & Push Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:ci-latest \
            ./apps/frontend/app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:ci-latest
