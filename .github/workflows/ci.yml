name: CI

on:
  push:
    branches: ['master']
  pull_request:

jobs: 
  # -------------------------------------------------
  # Job 1: Build API JAR Backend
  # -------------------------------------------------
  build-api:
    name: Build API Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Validate repository structure
        run: |
          test -d apps
          test -d infra
          test -d docs
          test -d scripts

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  #v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR file
        run: |
          cd apps/api
          mvn clean package -DskipTests

      - name: Upload API JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
         name: api-jar
         path: apps/api/target/*.jar
          
  # ---------------------------------------------------
  # Job 2: API Contract Check
  # ---------------------------------------------------
  api-contract-check:
    name: API Contract Check
    runs-on: ubuntu-latest
    needs: build-api
    env:
      SERVICE_PORT: 8083
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  #v5.2.0
        with:
          distribution: temurin
          java-version: 17
      
      - name: Download API JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
         name: api-jar
         path: apps/api/target/

      - name: Run API contract check
        run: |
          bash scripts/ci/api-diff-ci.sh

  # ----------------------------------------------------
  # Job 3: Run Tests
  # ----------------------------------------------------
    
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  #v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Run Tests
        run: |
          cd apps/api
          mvn test

  # ----------------------------------------------------
  #  Job 4: Build Frontend Artifact
  # ----------------------------------------------------

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    needs: api-contract-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/frontend/app
          npm ci
          
      - name: Build Angular artifact
        run: |
          cd apps/frontend/app
          npm run build -- --configuration=production

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: frontend-dist
          path: apps/frontend/app/dist/app

  # ----------------------------------------------------
  # Job 5: Build & Push Backend Docker image
  # ----------------------------------------------------
   
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest \
            ./apps/api

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:ci-latest

  # -------------------------------------------------------
  # Job 6: Build & Push Frontend Docker image 
  # -------------------------------------------------------  

  docker-build-frontend:
    name: Docker Build & Push Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Download Frontend Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: apps/frontend/app/dist/app

      - name: Build & Push Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:ci-latest \
            ./apps/frontend/app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:ci-latest
