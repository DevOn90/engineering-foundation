name: Deps Review Instruction

permissions:
  pull-requests: write

on: 
  pull_request:
    types: [opened, reopened]

jobs:
  deps-review-instruction:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
        - name: Add dependency review instruction comment
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            REPO: ${{ github.repository }}
          run: |
            MARKER="DEPENDENCY_REVIEW_INSTRUCTION"

            # Define the comment body with a unique marker for idempotency
            BODY="<!-- $MARKER -->
            ## 🧠 Human Review Required (Dependency Update)

            Please follow dependency review process:

            1. Open `.github/PULL_REQUEST_TEMPLATE/05_dependency.md`
            2. Copy template
            3. Paste into PR comment
            4. Complete checklist before merge

            ⚠️ Do not merge without completing this review."

            # Create JSON payload
            PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

            # Get existing comments
            COMMENTS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments)

            # Check if the marker comment already exists
            if echo "$COMMENTS" | grep -qF "$MARKER"; then
                echo "Comment already exists. Skipping."
                exit 0
            fi

            echo "Posting instruction comment..."

            # Create comment
            curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments \
                -d "$PAYLOAD"