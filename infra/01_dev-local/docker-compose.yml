version: "3.9"

services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILE_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devdb
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev
    depends_on:
      - db
    volumes:
      - ../../logs/api:/logs

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
